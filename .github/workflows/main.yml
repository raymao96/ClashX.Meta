name: ClashX

on:
  workflow_dispatch:
    inputs:
      version:
        description: '發布版本（例如 v1.4.48；留空使用最新上游版本）'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: xcode-27
    env:
      MIHOMO_TAG: v1.19.34
      GH_TOKEN: ${{ github.token }}

    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: determine release version
      id: release
      env:
        INPUT_VERSION: ${{ inputs.version }}
      run: |
        case "$GITHUB_REF" in
          refs/heads/meta-tw) locale=TW; prefix=tw ;;
          refs/heads/meta-cn) locale=CN; prefix=cn ;;
          *) echo "Select the meta-tw or meta-cn branch." >&2; exit 1 ;;
        esac
        version="$INPUT_VERSION"
        if [ -z "$version" ]; then
          version="$(git describe --tags --match 'v[0-9]*' --abbrev=0)"
        fi
        if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "Version must have the format vX.X.X: $version" >&2
          exit 1
        fi
        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "tag=$prefix-$version" >> "$GITHUB_OUTPUT"
        echo "title=ClashX Meta $locale $version" >> "$GITHUB_OUTPUT"

    - name: install deps
      run: |
        bash install_dependency.sh "$MIHOMO_TAG"
        xcodebuild -resolvePackageDependencies -project ClashX.xcodeproj

    - name: build infos
      env:
        RELEASE_VERSION: ${{ steps.release.outputs.version }}
      run: |
        meta_commit="$(git rev-parse --verify refs/remotes/origin/meta^{commit})"
        meta_count="$(git rev-list --count "$meta_commit")"
        locale_count="$(git rev-list --count "$meta_commit..HEAD")"
        build_number="$((meta_count + locale_count))"
        /usr/libexec/PlistBuddy -c "Set CFBundleVersion $build_number" ClashX/Info.plist
        /usr/libexec/PlistBuddy -c "Set CFBundleShortVersionString $RELEASE_VERSION" ClashX/Info.plist
        /usr/libexec/PlistBuddy -c "Add coreVersion string $MIHOMO_TAG" ClashX/Info.plist
        /usr/libexec/PlistBuddy -c "Add gitBranch string $GITHUB_REF_NAME" ClashX/Info.plist
        /usr/libexec/PlistBuddy -c "Add gitCommit string ${GITHUB_SHA::7}" ClashX/Info.plist
        /usr/libexec/PlistBuddy -c "Add buildTime string $(date +%Y-%m-%d\ %H:%M)" ClashX/Info.plist

    - name: build
      run: |
        xcodebuild archive -project ClashX.xcodeproj -scheme ClashX\ Meta -archivePath archive/ClashX.xcarchive -showBuildTimingSummary -allowProvisioningUpdates

    - name: create zip
      run: ditto -c -k --sequesterRsrc --keepParent archive/ClashX.xcarchive/Products/Applications/ClashX\ Meta.app "ClashX Meta.zip"

    - name: publish release
      env:
        RELEASE_TAG: ${{ steps.release.outputs.tag }}
        RELEASE_TITLE: ${{ steps.release.outputs.title }}
      run: |
        git tag -f "$RELEASE_TAG" "$GITHUB_SHA"
        git push origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG" --force
        if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
          gh release upload "$RELEASE_TAG" "ClashX Meta.zip" --clobber
          gh release edit "$RELEASE_TAG" --title "$RELEASE_TITLE" --draft=false
        else
          gh release create "$RELEASE_TAG" "ClashX Meta.zip" --verify-tag --title "$RELEASE_TITLE" --generate-notes
        fi
